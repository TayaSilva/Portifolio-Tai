      rel="stylesheet"

    <!-- Dados estruturados (o Google entende quem é a pessoa do site) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Taiane Silva",
        "jobTitle": "Desenvolvedora Front-End",
        "url": "https://taianesilva.vercel.app/",
        "email": "mailto:taianens99@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "São Paulo", "addressCountry": "BR" },
        "worksFor": { "@type": "Organization", "name": "Pathbit" },
        "alumniOf": [
          { "@type": "EducationalOrganization", "name": "Instituto Infnet" },
          { "@type": "EducationalOrganization", "name": "Faculdade Líbano" },
          { "@type": "EducationalOrganization", "name": "FAM" }
        ],
        "knowsAbout": ["React", "Next.js", "Vue", "Vite", "TypeScript", "Tailwind", "UX Design", "Playwright"],
        "sameAs": ["https://www.linkedin.com/in/taianesilva99/", "https://github.com/TayaSilva"]
      }
    </script>

    <!-- Tema sem "piscar": aplica claro/escuro antes da página pintar -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('ts-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          if (sessionStorage.getItem('ts-intro') || location.hash) document.documentElement.classList.add('no-intro')
        } catch (e) {}
      })()
    </script>
